<!DOCTYPE html>
<html lang="en">

<head>
    <title>Calculator Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
</head>

<body>
    <div>
        <h1>Result: 
            <span id="result"></span>
        </h1>
    </div>
    <form class="form-control">
        <div class="mb-3">
            <input type="number" class="form-control" id="num1" placeholder="Type in 1st number">
        </div>
        <div class="mb-3">
            <input type="number" class="form-control" id="num2" placeholder="Type in 2nd number">
        </div>
        <div class="row">
            <button type="submit" data-operator="add" class="col btn btn-outline-primary mx-2">➕</button>
            <button type="submit" data-operator="subtract" class="col btn btn-outline-primary mx-2">➖</button>
            <button type="submit" data-operator="multiply" class="col btn btn-outline-primary mx-2">✖️</button>
            <button type="submit" data-operator="divide" class="col btn btn-outline-primary mx-2">➗</button>
        </div>
    </form>
</body>
<script>
    document.querySelector('form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const button = event.submitter;
        const operator = button.dataset.operator;

        let num1 = document.getElementById("num1").value;
        let num2 = document.getElementById("num2").value;

        console.log(operator);
        fetch(`/calculator/${operator}?num1=${num1}&num2=${num2}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('result').textContent = data.result;
            })

        document.getElementById("num1").value = null;
        document.getElementById("num2").value = null;
    })
</script>

</html>
